[package]
name = "parch-codecs"
description = "Compression codecs for the parch parallel archiver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["deflate64", "bzip2", "lzma", "zstd", "ppmd"]
deflate64 = ["dep:deflate64"]
bzip2 = ["dep:bzip2"]
lzma = ["dep:lzma-rust2"]
zstd = ["dep:zstd"]
ppmd = ["dep:ppmd-rust"]

[dependencies]
parch-core.workspace = true
flate2.workspace = true
libdeflater.workspace = true
libz-rs-sys.workspace = true
bzip2 = { workspace = true, optional = true }
deflate64 = { workspace = true, optional = true }
lzma-rust2 = { workspace = true, optional = true }
ppmd-rust = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }
